[workspace]
resolver = "2"
members = ["crates/seedlock-core", "crates/seedlock-cli", "crates/seedlock-qr", "crates/seedlock-ffi", "crates/uniffi-bindgen", "crates/seedlock-tools"]
# A plain `cargo build` (and the release scripts) builds the command-line program, exactly as before the
# phone app's crates were added; those are built with -p (see android/README.md).
default-members = ["crates/seedlock-core", "crates/seedlock-cli"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# Release builds: small, fast, and abort (never unwind) on panic so that a
# crash cannot leave half-cleaned secrets behind in unwinding frames.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# The phone app's library (android/build-rust.sh): the release build, except that a panic (a bug) becomes an
# error that the app shows, instead of closing the app at once; UniFFI catches it.
[profile.phone]
inherits = "release"
panic = "unwind"

# Make the crypto dependencies fast even in debug builds / `cargo test`
# (Argon2 with hundreds of MiB is painfully slow at opt-level 0).
[profile.dev.package."*"]
opt-level = 3
