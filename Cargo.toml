[workspace]
resolver = "2"
members = ["crates/seedlock-core", "crates/seedlock-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# Release builds: small, fast, and abort (never unwind) on panic so that a
# crash cannot leave half-cleaned secrets behind in unwinding frames.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# Make the crypto dependencies fast even in debug builds / `cargo test`
# (Argon2 with hundreds of MiB is painfully slow at opt-level 0).
[profile.dev.package."*"]
opt-level = 3
