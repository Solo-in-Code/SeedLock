[package]
name = "seedlock-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SeedLock: offline Bitcoin seed tool (command line)"

[[bin]]
name = "seedlock"
path = "src/main.rs"

[dependencies]
seedlock-core = { path = "../seedlock-core" }
# reading QR codes in camera pictures (shared with the phone app)
seedlock-qr = { path = "../seedlock-qr" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rpassword = "7"
zeroize = "1"

[features]
# Only for the test scripts in tools/ (cargo build --release --locked -p seedlock-cli --features test-hooks): the program
# then reads stand-in routing tables from SEEDLOCK_TEST_NET_DIR, so that the tests can show it a computer that is
# offline or online. Debug builds (cargo test) read them too. A released program never does: it has no way to be made
# to believe that the computer is offline (tools/build-release.sh checks that).
test-hooks = []

[dev-dependencies]
# to read back, in the tests, the QR codes that SeedLock draws
rqrr = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
# `--cfg seedlock_check_windows` type-checks the Windows console code on other systems (see ui.rs)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seedlock_check_windows)'] }
