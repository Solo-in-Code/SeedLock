[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Writes the Kotlin (and later Swift) code that calls seedlock-ffi; used on the computer that builds the phone app"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
